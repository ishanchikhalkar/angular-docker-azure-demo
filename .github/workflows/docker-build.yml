name: Angular Docker CI

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Angular application
      - name: Build Angular
        run: npm run build

      # 5. Run tests
      - name: Run Angular tests
        run: npm test -- --watch=false --no-progress

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -t angular-docker-azure-demo .